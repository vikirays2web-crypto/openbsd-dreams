          name: Checkout main
          command: git clone --depth 5 --quiet --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Stage inputs
          command: tar --extract --bzip2 --file=final-dist.tar.bz2
      - run:
          name: Record build info
          command: df -h
      - run:
          name: Index artifacts
